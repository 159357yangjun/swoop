name: ci-idm-next

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 + Qt 6 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-curl

      - name: Detect Qt bin directory
        shell: msys2 {0}
        run: |
          QT_BIN_WIN="$(cygpath -w "$(dirname "$(command -v windeployqt)")")"
          echo "QT_BIN=$QT_BIN_WIN" >> "$GITHUB_ENV"
          echo "Qt bin: $QT_BIN_WIN"

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel 2

      - name: Verify expected executables
        shell: pwsh
        run: |
          if (-not (Test-Path build/idm-next.exe)) { throw 'idm-next.exe missing' }
          if (-not (Test-Path build/idm-next-host.exe)) { throw 'idm-next-host.exe missing' }

      - name: Install NSIS for installer validation
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package CI distribution
        shell: pwsh
        run: ./installer/package.ps1 -SkipTools

      - name: Smoke test packaged runtime
        shell: pwsh
        run: |
          foreach ($required in @(
            'installer/dist/idm-next.exe',
            'installer/dist/idm-next-host.exe',
            'installer/dist/libgcc_s_seh-1.dll',
            'installer/dist/libstdc++-6.dll',
            'installer/dist/libwinpthread-1.dll',
            'installer/dist/libcurl-4.dll',
            'installer/dist/sqldrivers/qsqlite.dll',
            'installer/dist/browser-extension/manifest.json',
            'installer/dist/browser-extension/native-messaging-host/com.tencent.idm_next.json',
            'installer/dist/browser-extension/native-messaging-host/install_host.ps1'
          )) {
            if (-not (Test-Path $required)) { throw "packaged runtime missing: $required" }
          }

          $badExtensionFiles = Get-ChildItem 'installer/dist/browser-extension' -Recurse -File -Force | Where-Object {
            $_.Name -match '^test_' -or $_.Extension.ToLowerInvariant() -in @('.py', '.pyc', '.pyo')
          }
          if ($badExtensionFiles) {
            throw "development files leaked into browser extension package: $($badExtensionFiles.FullName -join ', ')"
          }

          $process = Start-Process `
            -FilePath (Resolve-Path 'installer/dist/idm-next.exe') `
            -ArgumentList '--cli','help' `
            -WorkingDirectory (Resolve-Path 'installer/dist') `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "packaged CLI smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Single-instance and IPC smoke test
        shell: pwsh
        run: |
          $dist = (Resolve-Path 'installer/dist').Path
          $exe = (Resolve-Path 'installer/dist/idm-next.exe').Path
          $first = Start-Process -FilePath $exe -WorkingDirectory $dist -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 250
              if ($first.HasExited) {
                throw "primary IDM Next instance exited early with code $($first.ExitCode)"
              }
              $first.Refresh()
              if ($first.MainWindowHandle -ne 0) {
                $ready = $true
                break
              }
            }
            if (-not $ready) { throw 'primary IDM Next window did not become ready' }

            # 普通二次启动必须激活已有窗口并迅速退出，而不是创建第二套下载引擎。
            $second = Start-Process -FilePath $exe -WorkingDirectory $dist -PassThru
            try {
              if (-not $second.WaitForExit(5000)) {
                throw 'second IDM Next launch did not reuse the existing GUI instance'
              }
              if ($second.ExitCode -ne 0) {
                throw "second IDM Next launch exited with code $($second.ExitCode)"
              }
            }
            finally {
              if (-not $second.HasExited) { Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue }
            }

            # GUI 已运行时 CLI 必须通过 IPC，而不是另起独立引擎。
            $remoteHelp = Start-Process -FilePath $exe -ArgumentList '--cli','help' -WorkingDirectory $dist -PassThru -Wait
            if ($remoteHelp.ExitCode -ne 0) {
              throw "remote CLI help failed with exit code $($remoteHelp.ExitCode)"
            }

            # 远端业务错误要传播为非 0 退出码，不能“连接成功就一律 exit 0”。
            $remoteMissing = Start-Process -FilePath $exe -ArgumentList '--cli','info','2147483647' -WorkingDirectory $dist -PassThru -Wait
            if ($remoteMissing.ExitCode -ne 1) {
              throw "remote CLI failure exit code was $($remoteMissing.ExitCode), expected 1"
            }
          }
          finally {
            if (-not $first.HasExited) { Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify package outputs
        shell: pwsh
        run: |
          $zip = Get-ChildItem installer/out/*-portable.zip | Select-Object -First 1
          if (-not $zip) { throw 'portable ZIP missing' }
          $setup = Get-ChildItem installer/out/*-setup-x64.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup EXE missing' }
          $sum = Get-Content installer/out/SHA256SUMS.txt
          if ($sum -notmatch '^([0-9a-f]{64})  (.+\.zip)$') { throw 'invalid checksum manifest' }
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'portable ZIP checksum mismatch' }

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: idm-next-win64-ci
          path: installer/out/*
          if-no-files-found: error