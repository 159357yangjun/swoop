name: ci

# main 直接提交与面向 main 的 PR 执行完整验证；避免 feature 分支 push + PR 重复跑两次。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build
        shell: msys2 {0}
        run: make all CC=gcc WINDRES=windres

      - name: Engine self-test
        shell: msys2 {0}
        run: ./swoop_selftest.exe

      - name: Native messaging host self-test
        shell: msys2 {0}
        run: ./swoop_nmhost.exe --selftest

      - name: Single-instance launch smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path './swoop.exe').Path
          $first = Start-Process -FilePath $exe -WorkingDirectory (Get-Location) -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              if ($first.HasExited) {
                throw "primary Swoop instance exited early with code $($first.ExitCode)"
              }
              $first.Refresh()
              if ($first.MainWindowHandle -ne 0) {
                $ready = $true
                break
              }
            }
            if (-not $ready) { throw 'primary Swoop window did not become ready' }

            $second = Start-Process -FilePath $exe -WorkingDirectory (Get-Location) -PassThru
            try {
              if (-not $second.WaitForExit(5000)) {
                throw 'second Swoop launch did not reuse the existing instance'
              }
              if ($second.ExitCode -ne 0) {
                throw "second Swoop launch exited with code $($second.ExitCode)"
              }
            }
            finally {
              if (-not $second.HasExited) { Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          finally {
            if (-not $first.HasExited) { Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify no static winhttp/winmm import
        shell: msys2 {0}
        run: |
          objdump -p swoop.exe | grep "DLL Name:"
          if objdump -p swoop.exe | grep -qiE "winhttp|winmm"; then
            echo "::error::IDM-parity violated: winhttp/winmm statically imported"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test packaging
        shell: pwsh
        run: python -m unittest packaging/test_make_release.py packaging/test_resource_encoding.py

      - name: Build portable package
        shell: pwsh
        run: python packaging/make_release.py

      - name: Verify checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/swoop-*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw 'Swoop ZIP missing' }
          $sum = Get-Content dist/SHA256SUMS.txt
          if ($sum -notmatch '^([0-9a-f]{64})  (.+\.zip)$') { throw 'invalid checksum manifest' }
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'Swoop ZIP checksum mismatch' }

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: swoop-win64-ci
          path: dist/*
          if-no-files-found: error