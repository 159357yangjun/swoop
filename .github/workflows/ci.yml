name: ci

# main 直接提交与面向 main 的 PR 执行完整验证；避免 feature 分支 push + PR 重复跑两次。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build
        shell: msys2 {0}
        run: make all CC=gcc WINDRES=windres

      - name: Engine self-test
        shell: msys2 {0}
        run: ./swoop_selftest.exe

      - name: Native messaging host self-test
        shell: msys2 {0}
        run: ./swoop_nmhost.exe --selftest

      - name: Single-instance startup-race smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path './swoop.exe').Path
          # 故意近同时启动两个进程，覆盖“两个进程都还没创建窗口”的竞态。
          $first = Start-Process -FilePath $exe -WorkingDirectory (Get-Location) -PassThru
          $second = Start-Process -FilePath $exe -WorkingDirectory (Get-Location) -PassThru
          $pair = @($first, $second)
          try {
            $winner = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 250
              foreach ($p in $pair) { $p.Refresh() }

              $alive = @($pair | Where-Object { -not $_.HasExited })
              if ($alive.Count -gt 1) { continue }
              if ($alive.Count -eq 0) { throw 'both Swoop instances exited during startup race' }

              $alive[0].Refresh()
              if ($alive[0].MainWindowHandle -ne 0) {
                $winner = $alive[0]
                break
              }
            }
            if (-not $winner) {
              throw 'startup race did not converge to exactly one ready Swoop instance'
            }

            $losers = @($pair | Where-Object { $_.HasExited })
            if ($losers.Count -ne 1) {
              throw 'exactly one secondary Swoop process should exit'
            }
            if ($losers[0].ExitCode -ne 0) {
              throw "secondary Swoop launch exited with code $($losers[0].ExitCode)"
            }

            # 稳态二次启动仍要立即复用已有窗口并退出。
            $third = Start-Process -FilePath $exe -WorkingDirectory (Get-Location) -PassThru
            try {
              if (-not $third.WaitForExit(5000)) {
                throw 'steady-state Swoop launch did not reuse the existing instance'
              }
              if ($third.ExitCode -ne 0) {
                throw "steady-state Swoop launch exited with code $($third.ExitCode)"
              }
            }
            finally {
              if (-not $third.HasExited) { Stop-Process -Id $third.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          finally {
            foreach ($p in $pair) {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            }
          }

      - name: Verify no static winhttp/winmm import
        shell: msys2 {0}
        run: |
          objdump -p swoop.exe | grep "DLL Name:"
          if objdump -p swoop.exe | grep -qiE "winhttp|winmm"; then
            echo "::error::IDM-parity violated: winhttp/winmm statically imported"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test packaging
        shell: pwsh
        run: python -m unittest discover -s packaging -p "test_*.py"

      - name: Build portable package
        shell: pwsh
        run: python packaging/make_release.py

      - name: Verify checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/swoop-*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw 'Swoop ZIP missing' }
          $sum = Get-Content dist/SHA256SUMS.txt
          if ($sum -notmatch '^([0-9a-f]{64})  (.+\.zip)$') { throw 'invalid checksum manifest' }
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'Swoop ZIP checksum mismatch' }

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: swoop-win64-ci
          path: dist/*
          if-no-files-found: error
