name: ci-idm-next

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 + Qt 6 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-curl

      - name: Detect Qt bin directory
        shell: msys2 {0}
        run: |
          QT_BIN_WIN="$(cygpath -w "$(dirname "$(command -v windeployqt)")")"
          echo "QT_BIN=$QT_BIN_WIN" >> "$GITHUB_ENV"
          echo "Qt bin: $QT_BIN_WIN"

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel 2

      - name: Verify expected executables
        shell: pwsh
        run: |
          if (-not (Test-Path build/idm-next.exe)) { throw 'idm-next.exe missing' }
          if (-not (Test-Path build/idm-next-host.exe)) { throw 'idm-next-host.exe missing' }

      - name: Engine self-test (local authenticated HTTP server)
        shell: msys2 {0}
        run: |
          # 这套引擎自测是仓库里最强的闸门（137 条断言：截断续传、限流倒计时、
          # 暂停/继续的单代线程、代理 407、写盘失败、Range 被无视时降级、连接复用……），
          # 但 IDM_BUILD_ENGINE_SELFTEST 默认 OFF、以前工作流一次都没提它 ——
          # 引擎回归全靠人记得手动跑。这一步把它变成闸门。
          #
          # 三条反「永久绿」设计，都是本会话真踩过的坑而不是假想：
          #   ① 没有 python 就装一个（runner 上装工具与本机不是一回事），
          #      装不到就红着退出 —— 绝不 skip，skip 等于这一步从此永远绿。
          #   ② 除了退出码，还必须从日志里解析出「结果：N 通过，M 失败」这一行，
          #      并要求 N≥100、M=0。光看退出码不够：程序压根没跑起来时，
          #      管道与 tail 会把真实状态盖掉（本会话在 ext_shot 上就是这么永久绿的）。
          #   ③ 服务由自测程序通过 /_shutdown 自己收摊，这一步**一个信号都不发**。
          #      MSYS2 下 `kill $pid` 实测会打到步骤自己的进程组：整步以 143=SIGTERM
          #      结束，annotations 里只剩「Process completed with exit code 143」，
          #      报出来的错和引擎毫无关系（第一版就是这么红的）。
          #      再加一层看门狗兜底：自测中途崩了没喊停，服务自己退，不吊死步骤。
          PORT=18080
          SUSER=idmuser
          SPASS=idmpass
          ST_BUILD=build-selftest
          ST_LOG=selftest.log
          export IDM_SELFTEST_MAX_LIFE=300

          # msys2 这个 shell 和 bash 一样带 `-e -o pipefail`：任何一条命令非零就整步
          # 当场退出。而我唯一能取证的是 annotations（日志要 admin，403 读不到），
          # 所以每一处可能非零的地方都必须先把 ::error:: 打出去，再 exit。
          if ! command -v python >/dev/null 2>&1; then
            echo "runner 上没有 python，用 choco 装（与 NSIS 那一步同一套办法）"
            choco install python3 -y --no-progress || choco install python -y --no-progress || true
            export PATH="/c/Python312:/c/Python311:/c/Python310:$PATH"
          fi
          if ! command -v python >/dev/null 2>&1; then
            echo "::error::runner 上拿不到 python —— 引擎自测需要它起本地 HTTP 服务。禁止静默跳过。"
            exit 1
          fi
          python --version

          # 单独一个构建目录：只编 core + 自测，不碰发行用的 build/，对打包零影响。
          if ! cmake -S . -B "$ST_BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release -DIDM_BUILD_ENGINE_SELFTEST=ON; then
            echo "::error::cmake configure 失败（$ST_BUILD，含 -DIDM_BUILD_ENGINE_SELFTEST=ON）"
            exit 1
          fi
          if ! cmake --build "$ST_BUILD" --target engine_selftest; then
            echo "::error::engine_selftest 编译失败 —— 这一步是闸门，编译不过就红，不做降级"
            exit 1
          fi
          if [ ! -f "$ST_BUILD/engine_selftest.exe" ]; then
            echo "::error::engine_selftest.exe 没生成"
            exit 1
          fi

          # 起服务前先确认这个端口没人应答。Windows 的 SO_REUSEADDR 允许同一个端口
          # 被多个进程同时 bind（本机实测残留过 7 个），新起的这个可能压根收不到请求，
          # 于是「服务统计」断言读到的是别人家的计数器 —— 假绿与假红都在这条路上。
          PRE=$(curl -s --noproxy '*' --max-time 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/_stats") || PRE=000
          if [ "$PRE" = "200" ]; then
            echo "::error::$PORT 上已经有一个服务在应答（残留进程？），它会让 _stats 类断言读到错误的计数器。这一步拒绝继续。"
            exit 1
          fi

          python tools/engine_selftest_server.py "$PORT" "$SUSER" "$SPASS" > server.log 2>&1 &
          SRV=$!
          echo "server pid=$SRV"

          # 等服务器真的在 listen：没这一步的话，「进程已启动但 socket 还没开」
          # 会变成一条与代码无关的假失败（甚至让「无凭据必须失败」那类用例假通过）。
          READY=0
          for i in $(seq 1 60); do
            CODE=$(curl -s --noproxy '*' --max-time 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/_stats") || CODE=000
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            if ! kill -0 $SRV 2>/dev/null; then
              echo "::error::python 服务提前退出，最后 40 行："
              tail -40 server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::等了 60 秒服务仍没监听 $PORT"
            tail -40 server.log
            exit 1
          fi

          # 自测失败时进程按失败条数退出（非 0），在 `-e` 下会直接掀掉这一步，
          # 后面的解析和 ::error:: 一条都到不了 —— 必须自己接住退出码。
          RC=0
          "./$ST_BUILD/engine_selftest.exe" "$PORT" "$SUSER" "$SPASS" > "$ST_LOG" 2>&1 || RC=$?

          # 只探测存活（kill -0 不投递任何信号），等它自己退；最多 20 秒。
          # 等不到也不判失败：产物与结论都已拿到，残留的服务进程由看门狗/作业结束收。
          for i in $(seq 1 40); do
            kill -0 $SRV 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 $SRV 2>/dev/null; then
            echo "::warning::服务 20 秒后仍在运行（/_shutdown 没生效？），交给看门狗 $IDM_SELFTEST_MAX_LIFE 秒兜底"
          fi

          TMPD=$(cygpath -u "$TEMP" 2>/dev/null || echo "$TEMP")
          rm -rf "$TMPD/idm_selftest_out" "$ST_BUILD"

          tail -40 "$ST_LOG"

          # 「没跑完」正是最需要报出来的情形，可 grep 无匹配返回 1，配上 pipefail
          # 会让这行赋值直接终止整步 —— 所以 || true，让下面的判空去定性。
          PASS_N=$(grep -oE '结果：[0-9]+' "$ST_LOG" | tail -1 | grep -oE '[0-9]+') || true
          FAIL_N=$(grep -oE '[0-9]+ 失败' "$ST_LOG" | tail -1 | grep -oE '[0-9]+') || true
          echo "引擎自测：通过=${PASS_N:-无} 失败=${FAIL_N:-无} 退出码=$RC"
          if [ -z "$PASS_N" ] || [ -z "$FAIL_N" ]; then
            echo "::error::日志里没有「结果：N 通过，M 失败」这一行 —— 自测压根没跑完，不能算通过。"
            exit 1
          fi
          if [ "$FAIL_N" != "0" ] || [ "$RC" -ne 0 ] || [ "$PASS_N" -lt 100 ]; then
            echo "::error::引擎自测未通过（通过=$PASS_N 需≥100，失败=$FAIL_N 需=0，退出码=$RC 需=0）"
            exit 1
          fi
          echo "引擎自测通过：$PASS_N 条断言全绿"

      - name: Install NSIS for installer validation
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package CI distribution
        shell: pwsh
        run: ./installer/package.ps1 -SkipTools

      - name: Smoke test packaged runtime
        shell: pwsh
        run: |
          foreach ($required in @(
            'installer/dist/idm-next.exe',
            'installer/dist/idm-next-host.exe',
            'installer/dist/libgcc_s_seh-1.dll',
            'installer/dist/libstdc++-6.dll',
            'installer/dist/libwinpthread-1.dll',
            'installer/dist/libcurl-4.dll',
            'installer/dist/sqldrivers/qsqlite.dll',
            'installer/dist/browser-extension/manifest.json',
            'installer/dist/browser-extension/native-messaging-host/com.tencent.idm_next.json',
            'installer/dist/browser-extension/native-messaging-host/install_host.ps1'
          )) {
            if (-not (Test-Path $required)) { throw "packaged runtime missing: $required" }
          }

          $badExtensionFiles = Get-ChildItem 'installer/dist/browser-extension' -Recurse -File -Force | Where-Object {
            $_.Name -match '^test_' -or $_.Extension.ToLowerInvariant() -in @('.py', '.pyc', '.pyo')
          }
          if ($badExtensionFiles) {
            throw "development files leaked into browser extension package: $($badExtensionFiles.FullName -join ', ')"
          }

          # 安装版是 machine-wide，必须显式把 Native Messaging Host 注册到 HKLM；
          # 便携版脚本默认 CurrentUser，二者由同一个脚本的 Scope 参数区分。
          $hostScript = Get-Content 'installer/dist/browser-extension/native-messaging-host/install_host.ps1' -Raw
          if ($hostScript -notmatch 'ValidateSet\("CurrentUser",\s*"Machine"\)') {
            throw 'native messaging installer does not expose CurrentUser/Machine scope'
          }
          $nsi = Get-Content 'installer/idm-next.nsi' -Raw
          if ($nsi -notmatch '-Scope Machine') {
            throw 'NSIS installer does not request machine-wide native messaging registration'
          }

          $process = Start-Process `
            -FilePath (Resolve-Path 'installer/dist/idm-next.exe') `
            -ArgumentList '--cli','help' `
            -WorkingDirectory (Resolve-Path 'installer/dist') `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "packaged CLI smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Single-instance startup-race and IPC smoke test
        shell: pwsh
        run: |
          $dist = (Resolve-Path 'installer/dist').Path
          $exe = (Resolve-Path 'installer/dist/idm-next.exe').Path

          # 判定条件一条都不改，只补“红的时候看得懂”：每个实例的 stdout/stderr 各自重定向到
          # 独立文件，抛错时把尾部贴进异常文本。以前这个断言只能报出「exited with code 1」，
          # 而 1 有两条完全不同的来路（连不上 vs 连上了没人回话），只能靠猜。
          # QT_LOGGING_TO_CONSOLE=1 让 Qt 日志走 stderr——GUI 子系统程序默认只发
          # OutputDebugString，重定向文件里会是空的，那条路就白留了。有了它，赢家 stderr 里
          # 「IPC server 已启动，监听 idm-next-ipc」和「IPC 请求: activate → 成功」两句话
          # 就是分诊依据：两句都有 = 交接成功；只有前一句 = 请求根本没被读走。
          $env:QT_LOGGING_TO_CONSOLE = '1'
          $logDir = Join-Path $env:TEMP ('idm-ipc-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          function Get-StreamTail([string]$path) {
            if (-not (Test-Path -LiteralPath $path)) { return '<没有输出文件>' }
            $tail = Get-Content -LiteralPath $path -Tail 40 -ErrorAction SilentlyContinue
            if (-not $tail) { return '<空>' }
            return ($tail -join "`n")
          }

          # 这一步测的是时序竞态，而"绿了一次"并不说明余量够：共享 runner 上慢一点就会翻。
          # 所以每个环节的实际耗时都记下来、连同退出码一起报出去，
          # 让绿灯也能被读成一组数据（离 5s/10s 窗口还有多远），而不是一个对勾。
          #
          # ⚠️ 通道选择：作业日志要 admin 权限（403），job summary 没有任何公开端点
          # （/actions/jobs/<id>/summary 返回 404），annotations 是唯一未认证也能读的，
          # 所以同一份内容既写 summary（给人看）也发 ::notice::（给排查的人用 API 读）。
          # 换行必须折成 " | "：workflow command 的 message 是单行的。
          $script:timings = @()
          $summaryPath = $env:GITHUB_STEP_SUMMARY
          function Write-Annotation([string]$text) {
            $one = $text -replace "`r?`n", ' | '
            if ($one.Length -gt 3800) { $one = $one.Substring(0, 3800) + ' ...(截断)' }
            Write-Host ("::notice title=step11::" + $one)
          }
          function Add-Timing([string]$label, $value) {
            $script:timings += ("| {0} | {1} |" -f $label, $value)
          }
          function Write-Timings {
            if ($script:timings.Count -eq 0) { return }
            $lines = @('### step 11 计时（无论红绿都记）', '', '| 环节 | 实测 |', '| --- | --- |')
            $lines += $script:timings
            if ($summaryPath) { $lines | Out-File -FilePath $summaryPath -Append -Encoding utf8 }
            Write-Annotation ('计时: ' + ($script:timings -join '   '))
          }

          # $entries 是 Start-Logged 的返回值（带 Name/Out/Err），不是 Process。
          # 同一份内容还写进 $GITHUB_STEP_SUMMARY：作业日志端点对非管理员返回 403、
          # annotations 又只有「Process completed with exit code 1」，
          # 而 check-run 的 output 是公开可读的 —— 只有落到 summary，
          # 红的时候才能真正看到是哪条断言、哪个进程、哪句 stderr。
          function Fail-WithLogs([string]$message, $entries) {
            $parts = @($message)
            foreach ($e in $entries) {
              if (-not $e) { continue }
              $parts += ("--- {0} stdout ---`n{1}" -f $e.Name, (Get-StreamTail $e.Out))
              $parts += ("--- {0} stderr ---`n{1}" -f $e.Name, (Get-StreamTail $e.Err))
            }
            $text = $parts -join "`n"
            if ($summaryPath) {
              ("### step 11 FAILED`n" + $text) |
                Out-File -FilePath $summaryPath -Append -Encoding utf8
            }
            Write-Annotation ('FAILED: ' + $text)
            throw $text
          }

          function Start-Logged {
            param([string]$Tag, [string[]]$Arguments = @())
            $out = Join-Path $logDir ($Tag + '.out.txt')
            $err = Join-Path $logDir ($Tag + '.err.txt')
            $spec = @{
              FilePath               = $exe
              WorkingDirectory       = $dist
              RedirectStandardOutput = $out
              RedirectStandardError  = $err
              PassThru               = $true
            }
            if ($Arguments.Count -gt 0) { $spec['ArgumentList'] = $Arguments }
            $p = Start-Process @spec
            return [pscustomobject]@{ Name = $Tag; Proc = $p; Out = $out; Err = $err }
          }

          # 故意近同时启动两个 GUI，覆盖“二者都还没建立 QLocalServer”的竞态。
          $t0 = Get-Date
          $first = Start-Logged 'first'
          $second = Start-Logged 'second'
          $byId = @{}
          $byId[$first.Proc.Id] = $first
          $byId[$second.Proc.Id] = $second
          $pair = @($first.Proc, $second.Proc)
          try {
            $winner = $null
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 250
              foreach ($p in $pair) { $p.Refresh() }
              $alive = @($pair | Where-Object { -not $_.HasExited })

              if ($alive.Count -gt 1) { continue }
              if ($alive.Count -eq 0) {
                Fail-WithLogs 'both IDM Next instances exited during startup race' @($first; $second)
              }

              $alive[0].Refresh()
              if ($alive[0].MainWindowHandle -ne 0) {
                $winner = $alive[0]
                break
              }
            }
            if (-not $winner) {
              Fail-WithLogs 'startup race did not converge to exactly one ready IDM Next GUI' @($first; $second)
            }

            $losers = @($pair | Where-Object { $_.HasExited })
            if ($losers.Count -ne 1) {
              Fail-WithLogs 'exactly one IDM Next secondary process should exit' @($first; $second)
            }
            if ($losers[0].ExitCode -ne 0) {
              Fail-WithLogs "secondary IDM Next launch exited with code $($losers[0].ExitCode)" `
                            @($byId[$losers[0].Id]; $first; $second)
            }
            Add-Timing '启动竞态收敛（一个窗口就绪 + 副实例退出码 0）' `
                       ('{0:N1}s / 副实例 pid={1}' -f `
                          ((Get-Date) - $t0).TotalSeconds, $losers[0].Id)

            # 稳态普通二次启动必须激活已有窗口并迅速退出。
            $third = Start-Logged 'third'
            $t3 = Get-Date
            try {
              if (-not $third.Proc.WaitForExit(5000)) {
                Fail-WithLogs 'steady-state IDM Next launch did not reuse the existing GUI instance' `
                              @($third; $byId[$winner.Id])
              }
              if ($third.Proc.ExitCode -ne 0) {
                Fail-WithLogs "steady-state IDM Next launch exited with code $($third.Proc.ExitCode)" `
                              @($third; $byId[$winner.Id])
              }
              Add-Timing '稳态二次启动（上限 5s）' `
                         ('{0:N1}s / 退出码 {1}' -f ((Get-Date) - $t3).TotalSeconds,
                          $third.Proc.ExitCode)
            }
            finally {
              if (-not $third.Proc.HasExited) { Stop-Process -Id $third.Proc.Id -Force -ErrorAction SilentlyContinue }
            }

            # GUI 已运行时 CLI 必须通过 IPC，而不是另起独立引擎。
            $remoteHelp = Start-Logged 'remote-help' @('--cli', 'help')
            $th = Get-Date
            $remoteHelp.Proc.WaitForExit()
            if ($remoteHelp.Proc.ExitCode -ne 0) {
              Fail-WithLogs "remote CLI help failed with exit code $($remoteHelp.Proc.ExitCode)" @($remoteHelp)
            }
            Add-Timing 'GUI 在跑时 CLI 经 IPC 出 help' `
                       ('{0:N1}s / 退出码 {1}' -f ((Get-Date) - $th).TotalSeconds,
                        $remoteHelp.Proc.ExitCode)

            # 远端业务错误要传播为非 0 退出码，不能“连接成功就一律 exit 0”。
            $remoteMissing = Start-Logged 'remote-missing' @('--cli', 'info', '2147483647')
            $remoteMissing.Proc.WaitForExit()
            if ($remoteMissing.Proc.ExitCode -ne 1) {
              Fail-WithLogs "remote CLI failure exit code was $($remoteMissing.Proc.ExitCode), expected 1" @($remoteMissing)
            }
          }
          finally {
            Write-Timings
            foreach ($p in $pair) {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            }
            Remove-Item -LiteralPath $logDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify package outputs
        shell: pwsh
        run: |
          $zip = Get-ChildItem installer/out/*-portable.zip | Select-Object -First 1
          if (-not $zip) { throw 'portable ZIP missing' }
          $setup = Get-ChildItem installer/out/*-setup-x64.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup EXE missing' }
          $sum = Get-Content installer/out/SHA256SUMS.txt
          if ($sum -notmatch '^([0-9a-f]{64})  (.+\.zip)$') { throw 'invalid checksum manifest' }
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'portable ZIP checksum mismatch' }

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: idm-next-win64-ci
          path: installer/out/*
          if-no-files-found: error
