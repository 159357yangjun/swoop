name: release-idm-next

on:
  push:
    tags: ['idm-next-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 + Qt 6 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-curl

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel 2

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build portable and installer packages
        shell: pwsh
        run: ./installer/package.ps1 -QtBin C:\msys64\mingw64\bin

      - name: Add setup checksum
        shell: pwsh
        run: |
          $manifest = 'installer/out/SHA256SUMS.txt'
          Get-ChildItem installer/out/*-setup-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content $manifest "$hash  $($_.Name)" -Encoding ASCII
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idm-next-win64
          path: installer/out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/idm-next-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/out/*.zip
            installer/out/*.exe
            installer/out/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
