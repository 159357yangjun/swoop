name: release-swoop

# Swoop 原生 Win32 版发布：使用独立 tag 前缀，避免和 master 分支的 IDM Next 混发。
# 发布示例：git tag swoop-v0.2.1 && git push origin swoop-v0.2.1
on:
  push:
    tags: ['swoop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches source version
        if: startsWith(github.ref, 'refs/tags/swoop-v')
        shell: pwsh
        run: |
          $header = Get-Content src/common/version.h -Raw -Encoding UTF8
          $match = [regex]::Match($header, 'IDM_VERSION_STR\s+"([^"]+)"')
          if (-not $match.Success) { throw 'cannot read IDM_VERSION_STR' }
          $expected = "swoop-v$($match.Groups[1].Value)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "release tag mismatch: expected $expected, got $env:GITHUB_REF_NAME"
          }

      - name: Set up MinGW (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build
        shell: msys2 {0}
        run: make all CC=gcc WINDRES=windres

      - name: Engine self-test
        shell: msys2 {0}
        run: ./swoop_selftest.exe

      - name: Native messaging host self-test
        shell: msys2 {0}
        run: ./swoop_nmhost.exe --selftest

      - name: Verify no static winhttp/winmm import
        shell: msys2 {0}
        run: |
          objdump -p swoop.exe | grep "DLL Name:"
          if objdump -p swoop.exe | grep -qiE "winhttp|winmm"; then
            echo "::error::IDM-parity violated: winhttp/winmm statically imported"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test release packaging
        run: python -m unittest packaging/test_make_release.py packaging/test_resource_encoding.py

      - name: Package
        run: python packaging/make_release.py

      - name: Verify checksum file
        shell: pwsh
        run: |
          $line = Get-Content dist/SHA256SUMS.txt
          if ($line -notmatch '^([0-9a-f]{64})  (.+\.zip)$') { throw 'Invalid SHA256SUMS.txt' }
          $actual = (Get-FileHash (Join-Path 'dist' $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'SHA256 mismatch' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swoop-win64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/swoop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
